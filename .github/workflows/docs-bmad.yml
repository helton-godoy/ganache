name: BMAD Documentation Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "project-context.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "scripts/**"
      - "project-context.md"
  schedule:
    # Run validation daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_validation:
        description: "Force full validation"
        required: false
        type: choice
        options:
          - "true"
          - "false"

jobs:
  bmad-validation:
    name: BMAD Documentation Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Install BMAD validation dependencies
        run: |
          # Make scripts executable
          chmod +x scripts/*.sh

      - name: Run BMAD Validation
        id: validation
        run: |
          echo "Running BMAD validation..."
          ./scripts/bmad-validate.sh
          VALIDATION_EXIT_CODE=$?

          echo "Validation exit code: $VALIDATION_EXIT_CODE"

          # Save validation results
          echo "validation_status=$([ $VALIDATION_EXIT_CODE -eq 0 ] && echo 'PASS' || echo 'FAIL')" >> $GITHUB_OUTPUT
          echo "validation_exit_code=$VALIDATION_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $VALIDATION_EXIT_CODE -ne 0 ]; then
            echo "BMAD validation failed with exit code: $VALIDATION_EXIT_CODE"
            exit 1
          fi

      - name: Generate BMAD Documentation
        if: github.event.inputs.force_validation == 'true' || github.event_name == 'schedule'
        run: |
          echo "Generating BMAD documentation..."
          ./scripts/bmad-generate.sh

      - name: Check documentation structure
        run: |
          echo "Checking documentation structure..."

          # Check required directories exist
          required_dirs=(
            "docs"
            "docs/architecture"
            "docs/development" 
            "docs/validation"
            "docs/handover"
            "docs/assets"
            "scripts"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing required directory: $dir"
              exit 1
            else
              echo "✅ Directory exists: $dir"
            fi
          done

      - name: Validate markdown files
        run: |
          echo "Validating markdown files..."

          # Check for required frontmatter in main documents
          required_frontmatter_files=(
            "docs/index.md"
            "docs/project-overview.md"
            "docs/architecture/architecture.md"
            "docs/handoff/technical-specs.md"
            "docs/handoff/deployment-guide.md"
          )

          for file in "${required_frontmatter_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              continue
            fi
            
            if head -n 1 "$file" | grep -q "^---$"; then
              echo "✅ Frontmatter found in: $file"
            else
              echo "❌ Missing frontmatter in: $file"
              exit 1
            fi
          done

      - name: Validate BMAD naming conventions
        run: |
          echo "Validating BMAD naming conventions..."

          # Check for BMAD-compliant naming
          bmad_patterns=(
            "project-overview"
            "architecture"
            "development"
            "handoff"
            "validation"
          )

          for pattern in "${bmad_patterns[@]}"; do
            if find docs -name "*${pattern}*" -type f | grep -q .; then
              echo "✅ BMAD pattern found: $pattern"
            else
              echo "❌ No BMAD pattern found: $pattern"
            fi
          done

      - name: Test API endpoints (if available)
        continue-on-error: true
        run: |
          echo "Testing API endpoints..."

          # Test local API if running
          if curl -f -s http://localhost:8080/health > /dev/null; then
            echo "✅ API health check passed"
            
            # Test main endpoints
            endpoints=(
              "/health"
              "/nodes/localhost/status"
            )
            
            for endpoint in "${endpoints[@]}"; do
              if curl -f -s "http://localhost:8080$endpoint" > /dev/null; then
                echo "✅ Endpoint $endpoint is accessible"
              else
                echo "⚠️ Endpoint $endpoint is not accessible"
              fi
            done
          else
            echo "ℹ️ API not running, skipping endpoint tests"
          fi

      - name: Generate validation report
        run: |
          echo "Generating validation report..."

          # Create validation report
          cat > validation-report.md << EOF
          # BMAD Validation Report

          ## Summary
          - **Date:** $(date)
          - **Branch:** ${{ github.ref_name }}
          - **Commit:** ${{ github.sha }}
          - **Status:** ${{ steps.validation.outputs.validation_status }}

          ## File Structure Analysis
          \`\`\`bash
          $(find docs -type f -name "*.md" | sort)
          \`\`\`

          ## Directory Structure
          \`\`\`bash
          $(find docs -type d | sort)
          \`\`\`

          ## Script Validation
          \`\`\`bash
          $(ls -la scripts/)
          \`\`\`

          ## Recommendations
          - Ensure all documents have proper frontmatter
          - Validate BMAD compliance regularly
          - Keep documentation synchronized with code changes
          EOF

          # Upload report as artifact
          echo "Validation report generated"

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bmad-validation-artifacts
          path: |
            validation-report.md
            *.log
            /tmp/*.json
          retention-days: 30

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const validationStatus = '${{ steps.validation.outputs.validation_status }}';
            const comment = validationStatus === 'PASS' 
              ? '✅ BMAD validation passed! Documentation is compliant.'
              : '❌ BMAD validation failed! Please check the validation report.';
              
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ BMAD validation failed!"
          echo "Please check the validation report for details."
          echo "Common issues:"
          echo "- Missing frontmatter YAML in documents"
          echo "- Non-BMAD compliant file naming"
          echo "- Missing required directories or files"
          echo "- Scripts not executable"
          exit 1

      - name: Success notification
        if: success()
        run: |
          echo "✅ BMAD validation successful!"
          echo "Documentation is compliant with BMAD standards."
          echo "All required documents are present and properly formatted."

  bmad-sync:
    name: BMAD Documentation Sync
    runs-on: ubuntu-latest
    needs: bmad-validation
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync documentation
        run: |
          echo "Syncing BMAD documentation..."

          # Update timestamp in index
          sed -i "s/\*\*Data:\*\* [0-9-]\+/\*\*Data:\*\* $(date +%Y-%m-%d)/" docs/index.md

          # Update version in all documents
          find docs -name "*.md" -exec sed -i "s/\*\*Versão:\*\* [0-9.]+/\*\*Versão:\*\* 1.0.0/" {} \;

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BMAD Sync Action"

          git add docs/
          git diff --staged --quiet || git commit -m "docs: sync BMAD documentation timestamp [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  security-scan:
    name: Documentation Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.force_validation == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          echo "Running security scan on documentation..."

          # Check for sensitive information
          sensitive_patterns=(
            "password"
            "secret"
            "key"
            "token"
            "api_key"
          )

          for pattern in "${sensitive_patterns[@]}"; do
            if grep -r -i "$pattern" docs/ --exclude-dir=.git 2>/dev/null; then
              echo "⚠️ Potential sensitive information found: $pattern"
            fi
          done

          # Check for broken links (basic check)
          find docs -name "*.md" -exec grep -H "\[.*\](" {} \; | while read -r line; do
            link=$(echo "$line" | sed 's/.*\[.*\](\([^)]*\)).*/\1/')
            if [[ "$link" == *.md ]] && [[ ! -f "$link" ]]; then
              echo "⚠️ Potential broken link: $link in $line"
            fi
          done

  performance-check:
    name: Documentation Performance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation size
        run: |
          echo "Checking documentation performance..."

          # Calculate documentation statistics
          total_files=$(find docs -name "*.md" | wc -l)
          total_lines=$(find docs -name "*.md" -exec wc -l {} + | tail -1 | awk '{print $1}')
          total_size=$(find docs -name "*.md" -exec wc -c {} + | tail -1 | awk '{print $1}')

          echo "Documentation Statistics:"
          echo "- Total files: $total_files"
          echo "- Total lines: $total_lines"
          echo "- Total size: $total_size bytes"

          # Check for oversized files
          find docs -name "*.md" -exec wc -l {} \; | while read -r line; do
            lines=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}')
            if [ "$lines" -gt 1000 ]; then
              echo "⚠️ Large file: $file ($lines lines)"
            fi
          done

      - name: Check for duplicate content
        run: |
          echo "Checking for duplicate content..."

          # Basic duplicate detection
          find docs -name "*.md" -exec basename {} \; | sort | uniq -d | while read -r duplicate; do
            echo "⚠️ Duplicate filename found: $duplicate"
          done
