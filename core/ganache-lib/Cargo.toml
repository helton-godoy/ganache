[package]
name = "ganache-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
ganache-api = { path = "../ganache-api" }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt", "time"] }
sysinfo = "0.30"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
lazy_static = "1.5.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0.145"
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.20"
rand = "0.8"

[dev-dependencies]
tempfile = "3.0"
