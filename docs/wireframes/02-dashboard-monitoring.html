<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ganache - Dashboard</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            slate: { 850: '#172033' },
                        }
                    }
                }
            }
        </script>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

            body {
                font-family: 'Inter', sans-serif;
            }

            .mono {
                font-family: 'JetBrains Mono', monospace;
            }

            /* Tree Connector Lines */
            .tree-line-v {
                position: absolute;
                width: 2px;
                background-color: #e2e8f0;
                top: 0;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                z-index: 0;
            }

            .tree-line-h {
                position: absolute;
                height: 2px;
                background-color: #e2e8f0;
                top: 50%;
                left: 0;
                right: 0;
                z-index: 0;
            }
        </style>
    </head>

    <body class="bg-gray-50 min-h-screen text-slate-900 flex">

        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col fixed h-full">
            <div class="p-6 border-b border-slate-800">
                <h1 class="text-xl font-black tracking-tight flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></div>
                    GANACHE
                </h1>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-slate-800 rounded-lg text-white font-medium">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                    Dashboard
                </a>
                <a href="#"
                    class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 01-2 2v4a2 2 0 012 2h14a2 2 0 012-2v-4a2 2 0 01-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                    Storage Pools
                </a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-700"></div>
                    <div>
                        <div class="text-sm font-bold">Admin</div>
                        <div class="text-xs text-slate-500">Locked</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 md:ml-64 p-8">

            <!-- Header -->
            <header class="flex items-center justify-between mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">Cluster Status</h2>
                    <p class="text-slate-500 text-sm">Last synced 2s ago</p>
                </div>
                <a href="index.html" class="text-sm text-blue-600 font-medium hover:underline">&larr; Back to Hub</a>
            </header>

            <!-- KPI Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Health</div>
                    <div class="text-2xl font-black text-emerald-500 flex items-center gap-2">
                        ONLINE
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <div class="text-slate-500 text-xs font-bold uppercase tracking-wider mb-2">Capacity</div>
                    <div class="text-2xl font-black text-slate-800">
                        24.5 <span class="text-sm font-medium text-slate-400">TB Free</span>
                    </div>
                    <div class="w-full bg-slate-100 h-1 mt-3 rounded-full overflow-hidden">
                        <div class="bg-blue-500 h-full w-[24%]"></div>
                    </div>
                </div>
            </div>

            <!-- Zpool Topology Tree (Interactive) -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
                <div class="flex items-center justify-between mb-8">
                    <h3 class="text-lg font-bold text-slate-800">Pool Topology: <span
                            class="mono text-blue-600">tank-01</span></h3>
                    <button
                        class="px-3 py-1 text-xs font-medium bg-slate-100 text-slate-600 rounded hover:bg-slate-200 transition">View
                        Logs</button>
                </div>

                <!-- Tree Structure -->
                <div class="flex flex-col items-center space-y-8">

                    <!-- ROOT: POOL -->
                    <div class="relative z-10 w-48 bg-slate-900 text-white rounded-lg p-4 shadow-lg text-center">
                        <div class="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1">Mirror Pool</div>
                        <div class="font-bold text-lg">tank-01</div>
                        <div
                            class="absolute -bottom-4 left-1/2 -translate-x-1/2 w-8 h-8 bg-emerald-500 rounded-full border-4 border-white flex items-center justify-center shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>

                    <!-- TREE BRANCHES -->
                    <div class="relative w-full max-w-2xl h-12">
                        <!-- Vertical line from pool -->
                        <div class="absolute top-0 bottom-0 left-1/2 w-px bg-slate-200 -z-10"></div>
                        <!-- Horiz line across -->
                        <div class="absolute bottom-0 left-1/4 right-1/4 h-px bg-slate-200 -z-10"></div>
                        <!-- Vertical lines to nodes -->
                        <div class="absolute bottom-0 top-1/2 left-1/4 w-px bg-slate-200 -z-10"></div>
                        <div class="absolute bottom-0 top-1/2 right-1/4 w-px bg-slate-200 -z-10"></div>
                    </div>

                    <!-- LEAVES: NODES/VDEVS -->
                    <div class="grid grid-cols-2 gap-16 w-full max-w-3xl">

                        <!-- VDEV/DISK 1 -->
                        <div
                            class="bg-slate-50 border border-slate-200 rounded-lg p-4 relative group hover:border-blue-400 transition-colors cursor-pointer">
                            <div
                                class="absolute -top-3 left-1/2 -translate-x-1/2 px-2 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase">
                                Primary</div>
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 bg-white rounded border border-slate-200 flex items-center justify-center text-slate-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 01-2 2v4a2 2 0 012 2h14a2 2 0 012-2v-4a2 2 0 01-2-2m-2-4h.01M17 16h.01" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="text-sm font-bold text-slate-700">ganache-01</div>
                                    <div class="mono text-[10px] text-slate-400">/dev/sda</div>
                                </div>
                            </div>
                            <div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-emerald-500"></div>
                        </div>

                        <!-- VDEV/DISK 2 -->
                        <div
                            class="bg-slate-50 border border-slate-200 rounded-lg p-4 relative group hover:border-blue-400 transition-colors cursor-pointer">
                            <div
                                class="absolute -top-3 left-1/2 -translate-x-1/2 px-2 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase">
                                Secondary</div>
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-10 h-10 bg-white rounded border border-slate-200 flex items-center justify-center text-slate-500">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                                        viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 01-2 2v4a2 2 0 012 2h14a2 2 0 012-2v-4a2 2 0 01-2-2m-2-4h.01M17 16h.01" />
                                    </svg>
                                </div>
                                <div>
                                    <div class="text-sm font-bold text-slate-700">ganache-02</div>
                                    <div class="mono text-[10px] text-slate-400">/dev/sdb</div>
                                </div>
                            </div>
                            <div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-emerald-500"></div>
                        </div>

                    </div>

                </div>
            </div>

        </main>

    </body>

</html>
